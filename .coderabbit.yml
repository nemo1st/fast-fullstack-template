# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ja"
tone_instructions: |
  プロフェッショナルかつ建設的にレビューしてください。
  具体的な改善提案を含め、コードの意図を尊重しながら問題点を指摘してください。
  セキュリティやパフォーマンスの問題は特に重要視してください。

early_access: false

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  code_guidelines:
    enabled: true
  web_search:
    enabled: true

chat:
  auto_reply: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
      - "[skip ci]"
    labels: []
    base_branches:
      - main

  path_filters:
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/poetry.lock"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.log"
    - "!**/.DS_Store"

  path_instructions:
    - path: "api/app/**/*.py"
      instructions: |
        FastAPIアプリケーションのレビュー観点:
        - 適切なHTTPメソッドとステータスコードの使用
        - エラーハンドリングの適切性
        - APIレスポンスの一貫性
        - 機密情報（APIキー等）のハードコード禁止

    - path: "**/Dockerfile*"
      instructions: |
        Dockerfileのレビュー観点:
        - ベースイメージのバージョン固定
        - レイヤーキャッシュの最適化
        - セキュリティ（root実行の回避）

  tools:
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
